<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>录音助手</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 主容器 -->
  <div class="app-container">
    
    <!-- 头部 -->
    <header class="header">
      <div class="logo">
        <h1 class="logo-text">录音助手</h1>
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">就绪</span>
        </div>
      </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="main-content">
      
      <!-- 录音区域 -->
      <section class="upload-section">
        <!-- 录音控制 -->
        <div class="recording-controls">
          <h3>🎙️ 开始录音</h3>
          <div class="record-buttons">
            <button class="record-btn" id="recordBtn">
              <span class="btn-icon" id="recordIcon">🎙️</span>
              <span id="recordText">开始录音</span>
            </button>
            <button class="stop-btn" id="stopBtn" disabled>
              <span class="btn-icon">⏹️</span>
              停止录音
            </button>
          </div>
          <div class="recording-time" id="recordingTime" style="display: none;">
            ⏱️ 录音时长: <span id="timeDisplay">00:00</span>
          </div>
          <div class="audio-preview" id="audioPreview" style="display: none;">
            <h4>📻 录音预览</h4>
            <audio controls id="previewAudio"></audio>
            <div class="preview-actions">
              <button class="save-btn" id="saveRecordingBtn">
                <span class="btn-icon">💾</span>
                保存录音
              </button>
              <button class="retry-btn" id="retryBtn">
                <span class="btn-icon">🔄</span>
                重新录音
              </button>
            </div>
          </div>
        </div>
        

        
        <!-- 上传进度 -->
        <div class="upload-progress" id="uploadProgress" style="display: none;">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <p class="progress-text" id="progressText">上传中...</p>
        </div>
      </section>

      <!-- 录音历史 -->
      <section class="history-section">
        <div class="section-header">
          <h2>
            <span class="section-icon">📚</span>
            录音历史
          </h2>
          <div class="history-controls">
            <button class="refresh-btn" id="refreshBtn">
              <span class="btn-icon">🔄</span>
              刷新
            </button>
          </div>
        </div>
        
        <!-- 搜索框 -->
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 搜索录音内容...">
        </div>

        <!-- 录音列表 -->
        <div class="recordings-list" id="recordingsList">
          <div class="loading" id="loadingState">
            <div class="loading-spinner">⏳</div>
            <p>加载中...</p>
          </div>
        </div>
      </section>
    </main>

    <!-- 录音详情模态框 -->
    <div class="modal" id="recordingModal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">录音详情</h3>
          <button class="close-btn" id="closeModal">✕</button>
        </div>
        
        <div class="modal-body">
          <!-- 音频播放器 -->
          <div class="audio-player" id="audioPlayer" style="display: none;">
            <audio controls id="audioElement">
              您的浏览器不支持音频播放。
            </audio>
          </div>
          
          <!-- 转写状态 -->
          <div class="transcription-status" id="transcriptionStatus">
            <span class="status-badge" id="statusBadge">处理中</span>
          </div>
          
          <!-- 转写结果 -->
          <div class="transcription-content">
            <h4>📝 转写内容</h4>
            <div class="transcription-text" id="transcriptionText">
              正在转写中，请稍候...
            </div>
          </div>
          
          <!-- 操作按钮 -->
          <div class="modal-actions">
            <button class="action-btn download-btn" id="downloadBtn">
              <span class="btn-icon">💾</span>
              下载文本
            </button>
            <button class="action-btn copy-btn" id="copyBtn">
              <span class="btn-icon">📋</span>
              复制文本
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 消息提示 -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
